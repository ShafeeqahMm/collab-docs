services:
  postgres:
    image: postgres:16-alpine
    container_name: collabdocs-postgres
    environment:
      POSTGRES_USER: collabdocs
      POSTGRES_PASSWORD: collabdocs
      POSTGRES_DB: collabdocs
    ports:
      # Mapped to 5433 on the host (not the default 5432) so this can run
      # alongside the job-queue-api project's Postgres container at the same time.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabdocs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
